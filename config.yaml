  - name: "SEC_Filings"
    seeds:
      # Apple Inc. filings example (you can swap CIK dynamically later)
      - "https://www.sec.gov/edgar/browse/?CIK=0000320193&owner=exclude"
      - "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent"
      - "https://www.sec.gov/edgar/search/"
      # RSS feed for real-time filings
      - "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=&dateb=&owner=exclude&start=0&count=100&output=atom"
    keywords:
      - "10-K"
      - "10-Q"
      - "8-K"
      - "form"
      - "filing"
      - "annual report"
      - "quarterly"
      - "edgar"
      - "sec"
    allowed_domains:
      - "sec.gov"
    extra:
      parse_pdfs: true
      parse_xml: true
      respect_robots: true
      max_depth: 3
      extract_filing_type: true


  - name: "SEC_Press_Releases"
    seeds:
      - "https://www.sec.gov/news/pressreleases"
      - "https://www.sec.gov/news/speeches"
      - "https://www.sec.gov/news/statements"
      - "https://www.sec.gov/news/spotlight"
    keywords:
      - "release"
      - "announcement"
      - "statement"
      - "rulemaking"
      - "commission"
      - "policy"
    allowed_domains:
      - "sec.gov"
    extra:
      page_type: "news"
      extract_date: true
      extract_author: true
      max_depth: 2


  - name: "SEC_Enforcement"
    seeds:
      - "https://www.sec.gov/enforcement"
      - "https://www.sec.gov/litigation/litreleases"
      - "https://www.sec.gov/litigation/admin"
      - "https://www.sec.gov/litigation/opinions"
    keywords:
      - "charged"
      - "fraud"
      - "violations"
      - "enforcement"
      - "penalty"
      - "settlement"
      - "litigation"
      - "complaint"
      - "indicted"
    allowed_domains:
      - "sec.gov"
    extra:
      extract_case_number: true
      extract_pdf_links: true
      extract_defendants: true
      extract_penalties: true
      max_depth: 3
